<svg

          viewBox="0 0 230 130"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"

        >
          <defs>

            <filter id="layoutGroundShadow" x="-30%" y="-30%" width="160%" height="170%">
              <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#8A8D96" flood-opacity="0.16" />
              <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#8A8D96" flood-opacity="0.08" />
            </filter>


            <filter id="layoutFloatShadow" x="-35%" y="-35%" width="170%" height="180%">
              <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1A1C24" flood-opacity="0.10" />
              <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1A1C24" flood-opacity="0.06" />
            </filter>


            <filter id="purpleGlow" x="-30%" y="-30%" width="160%" height="160%">
              <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#9132F0" flood-opacity="0.32" />
            </filter>


            <radialGradient id="layoutAmbientGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#EFDFFF" stop-opacity="0.7" />
              <stop offset="100%" stop-color="#F7EFFF" stop-opacity="0" />
            </radialGradient>
          </defs>


          <g opacity="0.9" class="art-ambientBackGlow">
            <ellipse cx="115" cy="65" rx="100" ry="48" fill="url(#layoutAmbientGlow)" opacity="0.5" />
            <circle cx="115" cy="65" r="88" stroke="#E6E7EB" stroke-width="1" stroke-dasharray="4 4" fill="none" />
            <circle cx="115" cy="65" r="62" stroke="#EFDFFF" stroke-width="1" fill="none" />
          </g>



          <g class="art-mainBlock">
            <rect
              x="56"
              y="38"
              width="74"
              height="60"
              rx="12"
              fill="#FFFFFF"
              filter="url(#layoutFloatShadow)"
            />


            <rect
              x="66"
              y="48"
              width="40"
              height="8"
              rx="3"
              fill="#9132F0"
            />

            <circle
              cx="118"
              cy="52"
              r="2.5"
              fill="#EFDFFF"
            />


            <rect
              x="66"
              y="62"
              width="25"
              height="26"
              rx="5"
              fill="#EFDFFF"
            />
            <rect
              x="97"
              y="62"
              width="25"
              height="26"
              rx="5"
              fill="#F7EFFF"
            />
          </g>


          <g class="art-sideBlock">
            <rect
              x="178"
              y="38"
              width="38"
              height="60"
              rx="12"
              fill="#FFFFFF"
              filter="url(#layoutFloatShadow)"
            />


            <rect x="184" y="47" width="26" height="6" rx="2.5" fill="#EFDFFF" />
            <rect x="184" y="57" width="26" height="6" rx="2.5" fill="#EBECEF" />
            <rect x="184" y="67" width="26" height="6" rx="2.5" fill="#EBECEF" />
            <rect x="184" y="77" width="18" height="6" rx="2.5" fill="#9132F0" />
          </g>


          <g class="art-caliperLayer">

            <line x1="24" y1="46" x2="24" y2="88" stroke="#6623A8" stroke-width="1.5" />
            <line x1="56" y1="46" x2="56" y2="88" stroke="#6623A8" stroke-width="1.5" />
            <line x1="24" y1="67" x2="56" y2="67" stroke="#6623A8" stroke-width="1.5" />


            <rect x="27" y="16" width="26" height="18" rx="5" fill="#6623A8" />
            <text
              x="40"
              y="29"
              fill="#FFFFFF"
              font-size="10.5"
              font-weight="700"
              font-family="system-ui, -apple-system, sans-serif"
              text-anchor="middle"
            >
              32
            </text>
            <line x1="40" y1="34" x2="40" y2="46" stroke="#6623A8" stroke-width="1.2" stroke-dasharray="2 2" />


            <line x1="130" y1="46" x2="130" y2="88" stroke="#9132F0" stroke-width="1.5" />
            <line x1="178" y1="46" x2="178" y2="88" stroke="#9132F0" stroke-width="1.5" />
            <line x1="130" y1="67" x2="178" y2="67" stroke="#9132F0" stroke-width="1.5" />


            <g filter="url(#purpleGlow)" class="art-heroCaliper">
              <rect x="141" y="16" width="26" height="18" rx="5" fill="#9132F0" />
              <text
                x="154"
                y="29"
                fill="#FFFFFF"
                font-size="10.5"
                font-weight="700"
                font-family="system-ui, -apple-system, sans-serif"
                text-anchor="middle"
              >
                48
              </text>
            </g>
            <line x1="154" y1="34" x2="154" y2="46" stroke="#9132F0" stroke-width="1.2" stroke-dasharray="2 2" />
          </g>
        </svg>
