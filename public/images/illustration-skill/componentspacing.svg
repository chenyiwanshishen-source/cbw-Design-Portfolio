<svg

          viewBox="0 0 230 130"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"

        >
          <defs>

            <filter id="componentGroundShadow" x="-30%" y="-30%" width="160%" height="170%">
              <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#8A8D96" flood-opacity="0.16" />
              <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#8A8D96" flood-opacity="0.08" />
            </filter>


            <filter id="componentFloatShadow" x="-35%" y="-35%" width="170%" height="180%">
              <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1A1C24" flood-opacity="0.10" />
              <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1A1C24" flood-opacity="0.06" />
            </filter>


            <filter id="blueGlow" x="-30%" y="-30%" width="160%" height="160%">
              <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#2258F4" flood-opacity="0.32" />
            </filter>


            <radialGradient id="componentAmbientGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#DCE5FF" stop-opacity="0.7" />
              <stop offset="100%" stop-color="#EEF2FF" stop-opacity="0" />
            </radialGradient>
          </defs>


          <g opacity="0.9" class="art-ambientBackGlow">
            <ellipse cx="115" cy="65" rx="100" ry="48" fill="url(#componentAmbientGlow)" opacity="0.5" />
            <circle cx="115" cy="65" r="88" stroke="#E6E7EB" stroke-width="1" stroke-dasharray="4 4" fill="none" />
            <circle cx="115" cy="65" r="62" stroke="#DCE5FF" stroke-width="1" fill="none" />
          </g>


          <g class="art-inputEntity">
            <rect
              x="37"
              y="34"
              width="156"
              height="26"
              rx="8"
              fill="#FFFFFF"
              filter="url(#componentFloatShadow)"
            />

            <circle
              cx="51"
              cy="47"
              r="3.2"
              stroke="#2258F4"
              stroke-width="1.4"
              fill="none"
            />
            <line
              x1="53.4"
              y1="49.4"
              x2="56.5"
              y2="52.5"
              stroke="#2258F4"
              stroke-width="1.4"
              stroke-linecap="round"
            />


            <rect
              x="64"
              y="44"
              width="62"
              height="6"
              rx="3"
              fill="#DCE5FF"
            />


            <circle
              cx="178"
              cy="47"
              r="2.5"
              fill="#EBECEF"
            />
          </g>


          <g class="art-buttonGroupEntity">

            <rect
              x="37"
              y="76"
              width="98"
              height="26"
              rx="8"
              fill="#2258F4"
              filter="url(#blueGlow)"
            />

            <path
              d="M82 89 H90 M87 86 L90 89 L87 92"
              stroke="#FFFFFF"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />


            <rect
              x="147"
              y="76"
              width="46"
              height="26"
              rx="8"
              fill="#FFFFFF"
              filter="url(#componentFloatShadow)"
            />

            <circle
              cx="170"
              cy="89"
              r="3"
              fill="#EBECEF"
            />
          </g>


          <g class="art-stackCaliper">

            <line x1="186" y1="60" x2="198" y2="60" stroke="#2258F4" stroke-width="1.5" />
            <line x1="186" y1="76" x2="198" y2="76" stroke="#2258F4" stroke-width="1.5" />
            <line x1="192" y1="60" x2="192" y2="76" stroke="#2258F4" stroke-width="1.5" />


            <g filter="url(#blueGlow)">
              <rect x="200" y="59" width="24" height="18" rx="5" fill="#2258F4" />
              <text
                x="212"
                y="72"
                fill="#FFFFFF"
                font-size="10.5"
                font-weight="700"
                font-family="system-ui, -apple-system, sans-serif"
                text-anchor="middle"
              >
                16
              </text>
            </g>

            <line x1="192" y1="68" x2="200" y2="68" stroke="#2258F4" stroke-width="1.2" stroke-dasharray="2 2" />
          </g>


          <g class="art-groupCaliper">

            <line x1="135" y1="72" x2="135" y2="105" stroke="#1A42B8" stroke-width="1.5" />
            <line x1="147" y1="72" x2="147" y2="105" stroke="#1A42B8" stroke-width="1.5" />
            <line x1="135" y1="89" x2="147" y2="89" stroke="#1A42B8" stroke-width="1.5" />


            <rect x="129" y="105" width="24" height="17" rx="4.5" fill="#1A42B8" />
            <text
              x="141"
              y="118"
              fill="#FFFFFF"
              font-size="10"
              font-weight="700"
              font-family="system-ui, -apple-system, sans-serif"
              text-anchor="middle"
            >
              12
            </text>

            <line x1="141" y1="89" x2="141" y2="105" stroke="#1A42B8" stroke-width="1.2" stroke-dasharray="2 2" />
          </g>
        </svg>
